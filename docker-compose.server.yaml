# Server version for Dockhand (or any remote Docker host).
#
# Differences from docker-compose.yaml (the PC version):
#   - pulls the image GitHub builds on every push, instead of building locally
#   - every setting comes from environment variables, which you enter in
#     Dockhand's "Environment Variables" for this stack (nothing secret in git)
#   - caches live in a named Docker volume
#   - login required (APP_PASSWORD), because the server is on the internet
#
# Required variables:  APP_IMAGE, APP_PASSWORD, OPENVPN_USER, OPENVPN_PASSWORD
# Optional: TORBOX_API_KEY to show the TorBox buttons
# Everything else has a sensible default. See DOCKHAND.md.

services:
  gluetun:
    image: qmcgaw/gluetun
    container_name: abb-vpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=nordvpn
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${OPENVPN_USER:?Set OPENVPN_USER (NordVPN service username)}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD:?Set OPENVPN_PASSWORD (NordVPN service password)}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES:-United Kingdom}
      - HTTPPROXY=on
      # DNS over HTTPS: DNS over TLS (the default) is blocked by many VPN servers.
      - DNS_UPSTREAM_RESOLVER_TYPE=doh
    # No ports published: the proxy is only reachable by the app.
    restart: unless-stopped

  audiobookbay-automated:
    image: ${APP_IMAGE:?Set APP_IMAGE, e.g. ghcr.io/yourname/audiobookbay-automated:latest}
    container_name: audiobookbay-automated
    ports:
      - "${APP_PORT:-5078}:5078"
    environment:
      # Login (required on a public server)
      - APP_PASSWORD=${APP_PASSWORD:?Set APP_PASSWORD - the app is reachable from the internet}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - TRUST_PROXY=${TRUST_PROXY:-false}
      # All AudioBook Bay traffic goes through the VPN; no fallback if it's down.
      - ABB_PROXY=http://gluetun:8888
      - ABB_HOSTNAME=${ABB_HOSTNAME:-audiobookbay.lu}
      - PAGE_LIMIT=${PAGE_LIMIT:-5}
      - ABB_REQUEST_DELAY=${ABB_REQUEST_DELAY:-2}
      - ABB_REQUEST_JITTER=${ABB_REQUEST_JITTER:-3}
      - ABB_COOLDOWN=${ABB_COOLDOWN:-300}
      - COVERS=${COVERS:-proxy}
      # TorBox (optional): your API key from torbox.app -> Settings -> API
      - TORBOX_API_KEY=${TORBOX_API_KEY:-}
      # Slow / dead torrents: check interval, nudge stalled ones, give up after N idle days (0 = never)
      - TORBOX_POLL_MINUTES=${TORBOX_POLL_MINUTES:-10}
      - TORBOX_REANNOUNCE_HOURS=${TORBOX_REANNOUNCE_HOURS:-6}
      - TORBOX_GIVE_UP_DAYS=${TORBOX_GIVE_UP_DAYS:-7}
      - TORBOX_REMOVE_ON_GIVE_UP=${TORBOX_REMOVE_ON_GIVE_UP:-true}
      - NAV_LINK_NAME=${NAV_LINK_NAME:-}
      - NAV_LINK_URL=${NAV_LINK_URL:-}
    depends_on:
      - gluetun
    volumes:
      - abb-data:/data
    networks:
      - pangolin_frontend
      - abb
    restart: unless-stopped
    
networks:
  pangolin_frontend:
    external: true
  abb:
    external: true
    

volumes:
  abb-data:
